AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CivicAid AI - Agentic Eligibility & Benefits Navigator for Indian Citizens
  Serverless Architecture: React (Amplify/CloudFront) -> API Gateway (HTTP v2) -> Lambda (FastAPI) -> S3 + DynamoDB

Globals:
  Function:
    Timeout: 29
    MemorySize: 512
    Runtime: python3.11
    Architectures:
      - x86_64
    Environment:
      Variables:
        ENVIRONMENT: production
        DEBUG: "False"
        STORAGE_BACKEND: dynamodb
        AWS_DYNAMODB_TABLE_SCHEMES: !Ref SchemesTable
        AWS_DYNAMODB_TABLE_USERS: !Ref UsersTable
        AWS_S3_BUCKET_DOCS: !Ref DocumentsBucket
        CORS_ORIGINS: "*"
        LLM_PROVIDER: gemini
        LLM_MODEL: gemini-1.5-flash

Resources:
  # =========================================================================
  # 1. API Gateway HTTP API (v2) with Native CORS and Low Latency
  # =========================================================================
  CivicAidHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Requested-With
          - X-Citizen-ID
        AllowOrigins:
          - "*"
        MaxAge: 3600

  # =========================================================================
  # 2. FastAPI Serverless Lambda Function
  # =========================================================================
  CivicAidFastAPIFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-FastAPI"
      CodeUri: ../
      Handler: backend.app.lambda_handler.handler
      Description: CivicAid AI FastAPI backend executing RAG Search, Multi-Agent Pipeline, and Rules Engine
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SchemesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - S3CrudPolicy:
            BucketName: !Ref DocumentsBucket
        - CloudWatchLogsFullAccess
      Events:
        RootEvent:
          Type: HttpApi
          Properties:
            Path: /
            Method: GET
            ApiId: !Ref CivicAidHttpApi
        ProxyEvent:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
            ApiId: !Ref CivicAidHttpApi

  # =========================================================================
  # 3. Amazon DynamoDB Tables (On-Demand Pay-Per-Request Capacity)
  # =========================================================================
  SchemesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Schemes"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: category
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: CategoryIndex
          KeySchema:
            - AttributeName: category
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Users"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: profile_id
          AttributeType: S
      KeySchema:
        - AttributeName: profile_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # =========================================================================
  # 4. Amazon S3 Storage for Welfare Schemes Data & Documents
  # =========================================================================
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "civicaid-docs-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
            AllowedOrigins:
              - "*"
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTempUploads
            Status: Enabled
            ExpirationInDays: 30

  # =========================================================================
  # 5. Amazon CloudWatch Log Group
  # =========================================================================
  FastAPILogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-FastAPI"
      RetentionInDays: 14

Outputs:
  HttpApiUrl:
    Description: Base URL for CivicAid AI Production HTTP API Gateway
    Value: !Sub "https://${CivicAidHttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
    Export:
      Name: !Sub "${AWS::StackName}-ApiUrl"

  LambdaFunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt CivicAidFastAPIFunction.Arn

  SchemesTableName:
    Description: DynamoDB Table for Government Schemes Knowledge Base
    Value: !Ref SchemesTable

  UsersTableName:
    Description: DynamoDB Table for Citizen Profiles
    Value: !Ref UsersTable

  DocumentsBucketName:
    Description: S3 Bucket Name for Documents
    Value: !Ref DocumentsBucket
